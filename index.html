<style>
 :root{--paper:#0f0c17;--paper2:#181022;--clay:#eb6d56;--ink:#f6f4fc;--soft:#948da8;--line:rgba(214,209,216,.16)}
 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#1a1226,#0f0c17 72%);color:var(--ink);
   font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
   display:flex;align-items:center;justify-content:center;padding:24px}
 .lock{width:100%;max-width:380px;text-align:center}
 .mark{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin:0}
 .mark b{color:var(--ink)}
 h1{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:26px;margin:26px 0 8px}
 p.sub{color:var(--soft);font-size:14.5px;line-height:1.55;margin:0 0 26px}
 form{display:flex;flex-direction:column;gap:12px}
 input{width:100%;padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--paper2);
   color:var(--ink);font-size:16px;font-family:inherit;outline:none;transition:border-color .2s}
 input:focus{border-color:var(--clay)}
 button{padding:14px 16px;border:0;border-radius:8px;background:var(--clay);color:#1a0f0b;font-weight:700;
   font-size:15px;font-family:'Space Grotesk',system-ui,sans-serif;cursor:pointer;transition:filter .2s}
 button:hover{filter:brightness(1.06)} button:disabled{opacity:.6;cursor:default}
 .err{min-height:18px;color:var(--clay);font-size:13px;margin-top:2px}
 .foot{margin-top:22px;font-size:12px;color:var(--soft)}
 @media(prefers-reduced-motion:no-preference){.lock{animation:f .5s ease}} @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
</style>
